name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      # slop-shop's own tests pass even though it is full of bugs. That is the point of the demo.
      - run: pnpm --filter slop-shop test
      # Sentinel must pass its own checks.
      - run: pnpm selfscan
      - run: pnpm build
